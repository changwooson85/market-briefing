name: Daily Dictation (Morning)

on:
  schedule:
    # UTC 22:00 = KST 07:00
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  send-dictation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # 정답 파일을 리포지토리에 커밋하기 위해 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run dictation morning
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dictation_morning.py

      - name: Commit answer file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dictation_answers/
          git diff --staged --quiet || git commit -m "Add dictation answers $(date +%Y-%m-%d)"
          git push
